name: GUI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libgl1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[gui-dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PATHVIEW_OFFLINE: "1"
        run: pytest
